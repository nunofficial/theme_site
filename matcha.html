<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Оформление заказа — CoffeeTime</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { --accent: #c49b63; --text: #fff; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
  color: var(--text);
  overflow-x: hidden;
}
body::before { 
  content: ""; 
  position: fixed; 
  inset: 0; 
  background: rgba(0,0,0,0.12); 
  pointer-events: none; 
  z-index: -1; 
}
body.dark::before { background: rgba(0,0,0,0.45); }
body.peace { --accent: #e8d86a; }
body.energy { --accent: #3b82f6; }
body.mystic { --accent: #8b5cf6; }

header { 
  position: fixed; 
  top: 0; 
  width: 100%; 
  padding: 15px 20px; 
  background: rgba(0,0,0,0.2); 
  backdrop-filter: blur(8px); 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  z-index: 100; 
}
.logo { font-size: 22px; font-weight: bold; color: var(--accent); }

nav {
  display: flex;
  align-items: center;
  gap: 15px;
}
nav a { 
  text-decoration: none; 
  font-weight: bold; 
  color: var(--text); 
}
nav .theme-mood {
  display: flex;
  align-items: center;
  gap: 10px;
}

.burger { 
  display: none; 
  cursor: pointer; 
  color: white; 
  font-size: 26px; 
}

@media(max-width:768px){
  nav { 
    display: none; 
    position: absolute; 
    right: 15px; 
    top: 65px; 
    background: rgba(0,0,0,0.6); 
    padding: 15px; 
    border-radius: 10px; 
    flex-direction: column;
    gap: 10px;
  } 
  nav.open { display: flex; } 
  nav a, nav .theme-mood { display: block; margin: 10px 0; } 
  .burger { display: block; } 
}

section { 
  min-height: 100vh; 
  display: flex; 
  flex-direction: column; 
  justify-content: flex-start; 
  text-align: center; 
  padding: 130px 20px 80px; 
  opacity: 0; 
  transform: translateY(50px); 
  transition: .8s; 
  color: var(--text); 
}
section.visible { 
  opacity: 1; 
  transform: translateY(0); 
}

.card { 
  border: 2px solid var(--accent); 
  padding: 20px; 
  border-radius: 12px; 
  background: rgba(0,0,0,0.35); 
  backdrop-filter: blur(6px); 
  font-weight: bold; 
  color: white; 
  display:flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 10px;
}
.card img { 
  width: 100%; 
  max-width:200px; 
  border-radius:10px;
}

form {
  max-width: 400px;
  margin: 30px auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: rgba(0,0,0,0.35);
  padding: 20px;
  border-radius: 12px;
  backdrop-filter: blur(6px);
}

form input {
  padding: 10px;
  border-radius: 6px;
  border: none;
  font-weight: bold;
  font-size: 14px;
}

form button {
  background: var(--accent);
  border: none;
  color: #000;
  font-weight: bold;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

footer { 
  text-align: center; 
  padding: 18px; 
  background: rgba(0,0,0,0.65); 
  color: var(--text); 
  font-size: 14px; 
  margin-top:50px; 
}
</style>
</head>
<body>
<header>
  <div class="logo">CoffeeTime</div>
  <div class="burger" onclick="toggleMenu()">☰</div>
  <nav>
    <a href="index.html">Главная</a>
    <a href="about.html">О нас</a>
    <a href="order.html">Заказ</a>
    <div class="theme-mood">
      <select id="themeSelect" onchange="setTheme(this.value)">
        <option value="auto">Авто тема</option>
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
      </select>
      <select id="moodSelect" onchange="setMood(this.value)">
        <option value="peace">Уютный</option>
        <option value="energy">Энергичный</option>
        <option value="mystic">Загадочный</option>
      </select>
    </div>
  </nav>
</header>

<section>
<h1>Оформление заказа</h1>
<p>Вы заказываете: <strong>☕ Матча 50$</strong></p>

<div class="card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsQmhSDWkXEaZVqzrCUY1H-ROjuVYvg-1Rcg&s?auto=format&w=200&q=80" alt="Эспрессо">
  <p>Матча — ароматный и нежный кофе для бодрого утра.</p>
</div>

<form>
  <input type="text" placeholder="Ваше имя" required>
  <input type="text" placeholder="Адрес доставки" required>
  <input type="text" placeholder="Номер карты (16 цифр)" maxlength="16" required>
  <input type="text" placeholder="Срок действия (MM/YY)" required>
  <input type="text" placeholder="CVC/CVV" maxlength="4" required>
  <button type="submit">Оплатить и оформить заказ</button>
</form>
</section>

<footer>© 2025 CoffeeTime — аромат, уют и тепло</footer>

<audio id="click" src="https://assets.mixkit.co/active_storage/sfx/1074/1074-preview.mp3"></audio>
<script>
document.addEventListener("click",()=>{ 
  const a=document.getElementById("click"); 
  if(a) a.play().catch(()=>{}); 
});

const obs=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add("visible")));
document.querySelectorAll("section").forEach(s=>obs.observe(s));

function toggleMenu(){ 
  document.querySelector("nav").classList.toggle("open"); 
}

function applyAutoTheme(){ 
  const h=new Date().getHours(); 
  document.body.classList.toggle("dark",h>19||h<7); 
}

function setTheme(v){ 
  localStorage.theme=v; 
  if(v==="auto") applyAutoTheme(); 
  else document.body.classList.toggle("dark",v==="dark"); 
}

setTheme(localStorage.theme||"auto");

function setMood(v){ 
  document.body.classList.remove("peace","energy","mystic"); 
  document.body.classList.add(v); 
}
setMood("peace");
</script>
</body>
</html>
